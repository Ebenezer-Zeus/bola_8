<!-- Declara documento HTML5 -->
<!DOCTYPE html>
<!-- Define idioma principal como português do Brasil -->
<html lang='pt-br'>
<head>
    <!-- Define codificação UTF-8 para suportar caracteres acentuados -->
    <meta charset='UTF-8'>
    <!-- Título exibido na aba do navegador para a página do carrinho -->
    <title>Carrinho</title>
    <!-- Importa estilos compartilhados do site -->
    <link rel='stylesheet' href='styles.css'>
</head>
<body>
    <!-- Cabeçalho secundário indicando a seção do carrinho -->
    <h2>Seu Carrinho</h2>
    <!-- Container que deverá ser preenchido com os itens do carrinho via JavaScript -->
    <div id='cartItems'></div>
    <!-- Botão que aciona a função JS para finalizar a compra -->
    <button onclick='finalizarCompra()'>Finalizar Compra</button>
    <!-- Inclusão do script que contém a função 'finalizarCompra' e outras lógicas -->
    <script src='scripts.js'></script>
</body>
</html>
