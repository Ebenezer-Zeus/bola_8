<!DOCTYPE html>
<!-- Declara que o documento usa HTML5. -->
<!-- Define o elemento raiz e o idioma da página. -->
<html lang="pt-br">
<!-- Inicia a área de configurações e metadados. -->
<head>
    <!-- Define a codificação necessária para acentos e símbolos. -->
    <meta charset="UTF-8">
    <!-- Ajusta a largura da página ao tamanho da tela do dispositivo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Define o texto que aparece na aba do navegador. -->
    <title>Carrinho | Bola 8</title>
    <!-- Carrega os estilos compartilhados com o restante do site. -->
    <link rel="stylesheet" href="styles.css">
<!-- Fecha a área de configurações e metadados. -->
</head>
<!-- Inicia o conteúdo visível da página. -->
<body>
    <!-- Cria o cabeçalho com os estilos das páginas secundárias. -->
    <header class="subpage-header">
        <!-- Liga a imagem da marca à página inicial. -->
        <a href="index.html" aria-label="Voltar à página inicial">
            <!-- Mostra a imagem da marca com descrição acessível. -->
            <img src="Bola 8.png" alt="Logo da Bola 8" class="logo-site">
        <!-- Fecha o link que envolve a imagem da marca. -->
        </a>
        <!-- Mostra o nome do site no cabeçalho. -->
        <h1>Bola 8</h1>
        <!-- Cria o espaço que os scripts preencherão com links da conta. -->
        <div id="userArea">
            <!-- Mostra inicialmente o link da conta antes da consulta da sessão. -->
            <a href="login.html">Entrar / criar conta</a> |
            <!-- Mostra inicialmente o link para o carrinho. -->
            <a href="cart.html">Carrinho</a>
        <!-- Fecha a área inicial de links da conta. -->
        </div>
    <!-- Fecha o cabeçalho da página. -->
    </header>
    <!-- Inicia a área principal com o fundo e o estilo da página. -->
    <main class="account-main">
        <!-- Cria o painel visual que contém os produtos do carrinho. -->
        <section class="account-panel cart-panel">
            <!-- Identifica a seção do carrinho. -->
            <h2>Seu carrinho</h2>
            <!-- Reserva um espaço acessível para mensagens e avisos. -->
            <p id="cartMessage" class="account-message" role="status"></p>
            <!-- Reserva um espaço que o JavaScript preencherá com os itens. -->
            <div id="cartItems" class="cart-items"></div>
            <!-- Reserva um espaço para mostrar o valor total do carrinho. -->
            <p id="cartTotal" class="cart-total"></p>
            <!-- Cria o botão informativo de finalização, desativado inicialmente. -->
            <button id="checkoutButton" type="button" disabled>Finalizar compra</button>
            <!-- Oferece um link para voltar à lista de produtos. -->
            <p><a class="back-link" href="index.html">Continuar comprando</a></p>
        <!-- Fecha o painel do carrinho. -->
        </section>
    <!-- Fecha a área principal. -->
    </main>
    <!-- Inicia o rodapé comum às páginas do site. -->
    <footer>
        <!-- Mostra o ano e o nome do site. -->
        <p>&copy; 2026 Bola 8</p>
        <!-- Mostra os créditos dos responsáveis pelo site. -->
        <p class="creditos">Luis Leandro S. * Ebenezer * Luan Pires</p>
    <!-- Fecha o rodapé. -->
    </footer>
    <!-- Carrega o código de sessões e identificação da conta. -->
    <script src="account.js"></script>
    <!-- Carrega o código que busca e apresenta os produtos do carrinho. -->
    <script src="scripts.js"></script>
<!-- Fecha o conteúdo visível da página. -->
</body>
<!-- Fecha o documento HTML. -->
</html>
